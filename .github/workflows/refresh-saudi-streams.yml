name: Refresh Saudi TV stream URLs

on:
  workflow_dispatch:
  schedule:
    # Every 2 hours, away from the top of the hour.
    - cron: "17 */2 * * *"

permissions:
  contents: write

concurrency:
  group: refresh-saudi-tv-streams
  cancel-in-progress: true

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install latest yt-dlp
        run: python -m pip install --upgrade yt-dlp

      - name: Refresh Quran and Sunnah stream URLs
        run: python scripts/update_saudi_streams.py

      - name: Commit only if JSON changed
        shell: bash
        run: |
          if git diff --quiet -- tv/kanallakan.json; then
            echo "No changes to commit."
            exit 0
          fi

          # Safety guard: fail if any file other than the target JSON changed.
          changed_files="$(git diff --name-only)"
          if [ "$changed_files" != "tv/kanallakan.json" ]; then
            echo "Unexpected files changed:"
            echo "$changed_files"
            exit 1
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add tv/kanallakan.json
          git commit -m "chore: refresh Saudi Quran/Sunnah stream URLs"
          git push
